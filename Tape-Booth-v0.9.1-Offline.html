/* Android camera controls stay inside the available viewport. */
:root {
    --ui-font: Roboto, "Segoe UI", system-ui, sans-serif;
    font-family: var(--ui-font);
}
.brand { font: 800 24px/1.12 var(--ui-font); letter-spacing: -.035em; }
.topbar .micro { font: 600 10px/1.25 var(--ui-font); letter-spacing: .04em; }
.section-title h1 { font-family: var(--ui-font); }
.camera-meta, .finder-osd, .resolution-pill, .resolution-pill select,
.camera-utilities .camera-start, .side-action small, .navbtn, .range-head {
    font-family: var(--ui-font);
    letter-spacing: .02em;
}
.camera-meta, .finder-osd, .resolution-pill select, .side-action small { font-size: 11px; font-weight: 700; }
.navbtn { font-size: 12px; font-weight: 700; }
.navbtn.active { font-weight: 800; }
.shell:not(:has(.home-screen)) { padding-top: 14px; }
html[data-screen=camera], html[data-screen=camera] body { overflow: hidden; overscroll-behavior: none; }
html[data-screen=camera] #app {
    height: 100dvh;
    min-height: 0;
    overflow: hidden;
}
html[data-screen=camera] .shell {
    box-sizing: border-box;
    display: grid;
    grid-template-rows: auto minmax(0,1fr) auto;
    gap: 8px;
    height: 100%;
    min-height: 0;
    overflow: hidden;
    padding: 14px 9px 10px;
}
html[data-screen=camera] .topbar { padding-bottom: 0; }
.camera-screen {
    display: grid;
    grid-template-rows: auto minmax(0,1fr) auto auto auto;
    min-height: 0;
    padding: 6px 9px 8px;
}
.camera-screen .finder { height: auto; min-height: 0; }
.camera-screen .camera-details { gap: 8px; margin: 7px 1px 4px; }
#cameraFilter {
    min-width: 0;
    min-height: 46px;
    flex: 1 1 auto;
    padding: 5px 8px;
    color: #162843;
    background: #edf2ff;
    border: 1px solid #a5b5d6;
    border-radius: 8px;
    font: 700 13px var(--ui-font);
    text-overflow: ellipsis;
}
html[data-theme=dark] #cameraFilter {
    color: #edf4ff;
    background: #253957;
    border-color: #788bad;
}
html[data-screen=camera] .bottom {
    position: static;
    transform: none;
    width: 100%;
    border-radius: 12px;
}
@media (max-height: 460px) {
    html[data-screen=camera] .shell { padding-top: 8px; gap: 5px; }
    html[data-screen=camera] .navbtn { flex-direction: row; gap: 3px; }
    html[data-screen=camera] .navbtn .tb-icon { width: 15px; height: 15px; }
}

/* Keep the viewfinder usable in short multi-window layouts as well. */
@media (orientation: landscape) and (max-height: 460px) {
    .camera-screen {
        grid-template-columns: minmax(0,1fr) minmax(215px,.86fr);
        grid-template-rows: auto auto minmax(0,1fr) auto;
        column-gap: 9px;
    }
    .camera-screen .finder { grid-area: 1 / 1 / -1 / 2; }
    .camera-screen .camera-meta { grid-area: 1 / 2; }
    .camera-screen .camera-details { grid-area: 2 / 2; }
    .camera-screen .camera-buttons { grid-area: 3 / 2; align-self: center; }
    .camera-screen .camera-utilities { grid-area: 4 / 2; }
}

/* Paint from a reduced, edge-guided color field so fine photo texture gives way
   to continuous washes. Let a little pigment collect at the surviving edges. */
function washPhoto(context, width, height, amount) {
    const strength=amount/100;
    if (!strength) return;
    const low=document.createElement('canvas');
    const resolution=Math.round(640-390*strength);
    const scale=Math.min(1,resolution/Math.max(width,height));
    const w=low.width=Math.max(1,Math.round(width*scale));
    const h=low.height=Math.max(1,Math.round(height*scale));
    const small=low.getContext('2d',{willReadFrequently:true});
    small.imageSmoothingQuality='high';
    small.drawImage(context.canvas,0,0,w,h);
    const image=small.getImageData(0,0,w,h);
    const data=image.data, output=small.createImageData(w,h);
    const reach=2+Math.round(4*strength);
    for(let y=0;y<h;y++){
        const y0=Math.max(0,y-reach),y1=Math.min(h-1,y+reach);
        for(let x=0;x<w;x++){
            const p=(y*w+x)*4;
            const r=data[p],g=data[p+1],b=data[p+2],light=(r+2*g+b)/4;
            const left=Math.max(0,x-reach),right=Math.min(w-1,x+reach);
            const neighbors=[
                (y*w+left)*4,(y*w+right)*4,(y0*w+x)*4,(y1*w+x)*4,
                (y0*w+left)*4,(y0*w+right)*4,(y1*w+left)*4,(y1*w+right)*4
            ];
            let ar=r,ag=g,ab=b,total=1,gradient=0;
            for(const n of neighbors){
                const nr=data[n],ng=data[n+1],nb=data[n+2];
                const delta=Math.abs(nr-r)+Math.abs(ng-g)+Math.abs(nb-b);
                const weight=1/(1+delta*delta/(6500+strength*9000));
                ar+=nr*weight;ag+=ng*weight;ab+=nb*weight;total+=weight;
                gradient=Math.max(gradient,(nr+2*ng+nb)/4-light);
            }
            const shadow=Math.min(1,Math.max(0,gradient-11)/78);
            const glaze=.022+strength*.047;
            const pigment=shadow*(.047+.082*strength);
            const grain=((Math.imul(x+71,1831565813)^Math.imul(y+43,91461761))>>>24)/255-.5;
            const paper=grain*strength*(1+6*Math.sin(Math.PI*light/255));
            output.data[p]=ar/total*(1-glaze-pigment)+244*glaze+paper;
            output.data[p+1]=ag/total*(1-glaze-pigment)+239*glaze+paper;
            output.data[p+2]=ab/total*(1-glaze-pigment)+225*glaze+paper;
            output.data[p+3]=255;
        }
    }
    small.putImageData(output,0,0);
    context.save();
    context.globalAlpha=Math.min(1,strength*1.34);
    context.imageSmoothingEnabled=true;context.imageSmoothingQuality='high';
    context.drawImage(low,0,0,width,height);
    context.restore();
}

/* Trace from the original photograph at a stable scale. The wash's downsampling
   never erases these contours, and the local contrast floor suppresses grain. */
function tracePhoto(source, width, height) {
    const mask=document.createElement('canvas');
    const scale=Math.min(1,850/Math.max(width,height));
    const w=mask.width=Math.max(1,Math.round(width*scale));
    const h=mask.height=Math.max(1,Math.round(height*scale));
    const ctx=mask.getContext('2d',{willReadFrequently:true});
    ctx.imageSmoothingQuality='high';
    ctx.drawImage(source,0,0,w,h);
    const pixels=ctx.getImageData(0,0,w,h).data;
    const luminance=new Float32Array(w*h);
    for(let p=0;p<luminance.length;p++){
        const i=p*4;
        luminance[p]=(54*pixels[i]+183*pixels[i+1]+19*pixels[i+2])/256;
    }
    const output=ctx.createImageData(w,h);
    for(let y=1;y<h-1;y++){
        for(let x=1;x<w-1;x++){
            const p=y*w+x,i=p*4;
            const tl=luminance[p-w-1],tm=luminance[p-w],tr=luminance[p-w+1];
            const ml=luminance[p-1],mr=luminance[p+1];
            const bl=luminance[p+w-1],bm=luminance[p+w],br=luminance[p+w+1];
            const dx=(tr+2*mr+br-tl-2*ml-bl)*.25;
            const dy=(bl+2*bm+br-tl-2*tm-tr)*.25;
            const contrast=Math.hypot(dx,dy);
            const darkSide=(tl+tm+tr+ml+mr+bl+bm+br)/8-luminance[p];
            const edge=Math.max(0,Math.min(1,(contrast-19)/66));
            const side=Math.max(0,Math.min(1,(darkSide+3)/27));
            output.data[i]=27;output.data[i+1]=29;output.data[i+2]=28;
            output.data[i+3]=Math.round(225*edge*side);
        }
    }
    ctx.putImageData(output,0,0);
    return mask;
}

return {washPhoto,tracePhoto};
})();
modules["cicada-summer"] = (() => {
/* Photographic visual novel treatment for user-supplied imagery. */
const limit = (value, min = 0, max = 1) => Math.max(min, Math.min(max, value));
const mix = (a, b, amount) => a + (b - a) * amount;
const luma = (r, g, b) => (54 * r + 183 * g + 19 * b) / 256;
const band = (v, center, width) => limit(1 - Math.abs(v - center) / width);

function applyCicadaSummer(image, edit, effects) {
    const {width, height, data} = image;
    const intensity = limit(edit.intensity / 100);
    if (intensity === 0) return image;

    const age = limit((edit.degradation ?? 65) / 100);
    const out = new ImageData(width, height);
    const pixels = out.data;
    const brightness = new Float32Array(width * height);
    for (let i = 0, p = 0; i < data.length; i += 4, p++) {
        brightness[p] = luma(data[i], data[i + 1], data[i + 2]);
    }

    const radius = Math.max(1, Math.round(Math.max(width, height) / 440));
    const softness = effects.softness / 100 * age;
    const inkStrength = effects.sharpening / 100 * age;
    const glowStrength = effects.bloom / 100 * age;
    const tintStrength = effects.bleed / 100 * age;
    const texture = age * (effects.noise / 100 + (edit.grain ?? 15) / 125);
    const posterLevels = Math.round(mix(18, 6, age));
    const denom = posterLevels - 1;

    for (let y = 0; y < height; y++) {
        const row = y * width;
        const above = Math.max(0, y - radius) * width;
        const below = Math.min(height - 1, y + radius) * width;
        const glowAbove = Math.max(0, y - radius * 3) * width;
        const glowBelow = Math.min(height - 1, y + radius * 3) * width;

        for (let x = 0; x < width; x++) {
            const p = row + x;
            const i = p * 4;
            const left = row + Math.max(0, x - radius);
            const right = row + Math.min(width - 1, x + radius);
            const up = above + x;
            const down = below + x;
            const v = brightness[p];
            const vl = brightness[left], vr = brightness[right], vu = brightness[up], vd = brightness[down];
            // Smooth across nearby colors while preserving the shape of strong edges.
            const wl = 1 / (1 + Math.abs(vl - v) / 29);
            const wr = 1 / (1 + Math.abs(vr - v) / 29);
            const wu = 1 / (1 + Math.abs(vu - v) / 29);
            const wd = 1 / (1 + Math.abs(vd - v) / 29);
            const normalization = 1 / (1 + wl + wr + wu + wd);
            const l = left * 4, r = right * 4, u = up * 4, d = down * 4;
            const red = mix(data[i], (data[i] + wl * data[l] + wr * data[r] + wu * data[u] + wd * data[d]) * normalization, softness);
            const green = mix(data[i + 1], (data[i + 1] + wl * data[l + 1] + wr * data[r + 1] + wu * data[u + 1] + wd * data[d + 1]) * normalization, softness);
            const blue = mix(data[i + 2], (data[i + 2] + wl * data[l + 2] + wr * data[r + 2] + wu * data[u + 2] + wd * data[d + 2]) * normalization, softness);
            const toned = luma(red, green, blue) / 255;
            const contrast = limit((toned - .46) * (1.22 + .25 * age) + .48);
            // Keep the fine texture anchored to the image rather than changing it each frame.
            const grain = ((Math.imul(x + 43, 1597334677) ^ Math.imul(y + 17, 3812015801)) >>> 0) / 4294967295 - .5;
            const stepped = Math.round(limit(contrast + grain * texture * .10) * denom) / denom;
            const light = mix(contrast, stepped, .3 + .5 * age);
            const neutral = 1 - limit((Math.max(red, green, blue) - Math.min(red, green, blue)) / 115);
            const lime = band(toned, .53, .18) * tintStrength * (.35 + .65 * neutral);
            const pink = band(toned, .73, .12) * tintStrength * (.3 + .7 * neutral);
            const shade = limit((.38 - toned) / .38) * tintStrength;
            const glowNearby = Math.max(brightness[glowAbove + x], brightness[glowBelow + x], vl, vr) / 255;
            const haze = limit((glowNearby - .76) / .24) * glowStrength * .16 * (.4 + .6 * toned);
            const paper = limit((light - .77) / .23) * (.3 + .32 * age);
            // Darken the darker side of an edge instead of enclosing every color band.
            const edge = limit((Math.max(vl, vr, vu, vd) - v - 9) / 54);
            const ink = 1 - edge * inkStrength * .82;
            const saturation = 1.12 + .34 * age;
            const speckle = grain * texture * .027;
            const redPaint = (light + (red / 255 - toned) * saturation + .09 * lime + .19 * pink - .05 * shade + haze * 1.02) * ink;
            const greenPaint = (light + (green / 255 - toned) * saturation + .16 * lime - .08 * pink + .012 * shade + haze) * ink;
            const bluePaint = (light + (blue / 255 - toned) * saturation - .14 * lime + .10 * pink + .048 * shade + haze * .92) * ink;

            pixels[i] = mix(data[i], limit(mix(redPaint, 1, paper) + speckle) * 255, intensity);
            pixels[i + 1] = mix(data[i + 1], limit(mix(greenPaint, 1, paper) + speckle) * 255, intensity);
            pixels[i + 2] = mix(data[i + 2], limit(mix(bluePaint, .985, paper) + speckle) * 255, intensity);
            pixels[i + 3] = data[i + 3];
        }
    }
    return out;
}

return {applyCicadaSummer};
})();
modules["art-presets"] = (() => {
const {washPhoto,tracePhoto} = modules["watercolor"];

    ['cicada-summer',{wash:60,outline:200,dim:10}],
    ['ink-signal',{wash:10,outline:100,dim:0}]
]);
const artControls=[
    {key:'wash',label:'Watercolor',max:100},
    {key:'outline',label:'Outline detail',max:200},
    {key:'dim',label:'Dim',max:75}
];
function artSettings(edit){
    const defaults=presets.get(edit.filter);
    if(!defaults)return null;
    return Object.fromEntries(artControls.map(({key,max})=>{
        const value=edit.art?.[key];
        return [key,Number.isFinite(value)?Math.min(max,Math.max(0,value)):defaults[key]];
    }));
}

const palette=[[25,30,23],[85,94,65],[151,154,105],[226,225,178]];
const threshold=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function dither(context,width,height,intensity){
    // Higurashify quantizes the working image directly. A fixed low-res
    // canvas followed by nearest-neighbor scaling creates oversized blocks.
    const image=context.getImageData(0,0,width,height);
    const pixels=image.data;
    for(let y=0;y<height;y++){
        for(let x=0;x<width;x++){
            const i=(y*width+x)*4;
            const r=pixels[i],g=pixels[i+1],b=pixels[i+2];
            const light=(r*.21+g*.72+b*.07)/255;
            const k=Math.max(0,Math.min(3,Math.floor(light*4+(threshold[(y%4)*4+x%4]-7.5)/16)));
            const [inkR,inkG,inkB]=palette[k];
            pixels[i]=r+(inkR-r)*intensity;
            pixels[i+1]=g+(inkG-g)*intensity;
            pixels[i+2]=b+(inkB-b)*intensity;
        }
    }
    context.putImageData(image,0,0);
}

function renderArt(context,width,height,settings,art,filterPixels){
    const strength=Math.min(1,Math.max(0,settings.intensity/100));
    const isInk=settings.filter==='ink-signal';

            media.getTracks().forEach(track => track.stop());
            const original = new Blob(chunks, {type:session.mimeType || mimeType});
            if (!original.size) { alertStatus('No video data recorded.'); return; }
            const created = Date.now();
            const name = `TB_VIDEO_${created}`;
            const savedToDownloads = await download(original, name + '.webm');
            try {
                await addPhoto({id:crypto.randomUUID(), created, name, original, edit:clipEdit, kind:'video'});
                photos = await getPhotos();
                if (page === 'gallery') render();
                alertStatus(savedToDownloads ? 'WebM saved to Downloads and Gallery.' : 'WebM saved to Gallery. Download unavailable.');
            } catch (e) {
                alertStatus((savedToDownloads ? 'WebM downloaded. ' : 'Download failed. ') + 'Gallery save failed: ' + e.message);
            }
        };
        session.start(1000);
        recorder = session;
        recordCanvas = canvas;
        recording = true;
        updateRecordControls();
    } catch (e) {
        media?.getTracks().forEach(track => track.stop());
        alertStatus('Video failed: ' + e.message);
    }
}
function stopRecording() {
    if (!recording) return;
    recording = false;
    recordCanvas = null;
    if (recorder?.state !== 'inactive') recorder.stop();
    recorder = null;
    updateRecordControls();
}
async function shutter() {
    if (videoMode) { recording ? stopRecording() : startRecording(); return; }
    try {
    const b = stream ? await originalFromCamera() : lastOriginal;
    if (!b) {
        alertStatus('Start camera or import a photo first.');
        return;
    }
    await saveNew(b);
}
catch (e) {
    alertStatus('Save failed: ' + e.message);
} }
async function importFile(file) { if (!file.type.startsWith('image/')) {
    alertStatus('Choose an image file.');
    return;
} try {
    lastOriginal = file;
    await loadImage(file);
    if (page === 'camera') {
        drawPreview();
        await saveNew(file);
        stopCamera();
        const imported=photos.find(p=>p.original===file) || photos[0];
        if(imported) await openEditor(imported);
    }
    else {
        alertStatus('Image loaded');
    }
}
catch (e) {
    alertStatus('Could not import image: ' + e.message);
} }
async function openEditor(p) { editorReturn = galleryMode === 'playback' ? 'playback' : 'gallery'; stopCamera(); current = p; quality = p.edit?.quality ?? NATIVE_RES[p.edit?.filter] ?? 640; fit = p.edit?.framing ?? fit; edit = { ...DEFAULT_EDIT, ...p.edit, effects: { ...p.edit.effects } }; await loadImage(p.original); page = 'editor'; render(); }
async function paintGallery() { if (page !== 'gallery')
    return; const tiles = document.querySelectorAll('[data-thumb]'); for (const t of tiles) {
    const p = photos.find(p => p.id === t.dataset.thumb);
    if (!p)
        continue;
    const thumb = await createThumbnail(p);
    if (page === 'gallery' && t.isConnected) {
        t.src = thumb;
        t.onload = () => URL.revokeObjectURL(thumb);
    }
    else
        URL.revokeObjectURL(thumb);
} if (galleryMode === 'playback')
    await paintPlayback(); }
async function createThumbnail(p) { const u = URL.createObjectURL(p.original); try {
    const im = new Image();
    im.src = u;
    await im.decode();
    const canvas = document.createElement('canvas');
    drawFrom(im, canvas, p.edit, 270, true);
    return await new Promise(r => canvas.toBlob(b => r(URL.createObjectURL(b)), 'image/jpeg', .65));
}
finally {
    URL.revokeObjectURL(u);
} }
async function paintPlayback() {
    const p = photos[galleryIndex];
    const player = $('#playbackVideo');
    if (player && p?.kind === 'video') {
        playbackUrl = URL.createObjectURL(p.original);
        player.src = playbackUrl;
        return;
    }
    const c = $('#playbackCanvas'); if (!p || !c)
    return; const u = URL.createObjectURL(p.original); try {
    const im = new Image();
    im.src = u;
    await im.decode();
    if (c.isConnected)
        drawFrom(im, c, p.edit, 960, true);
}
finally {
    URL.revokeObjectURL(u);
} }
async function outputBlob(image = source, settings = {...edit, framing:fit}, longEdge = quality, created = current?.created) {
    if (!image) throw Error('Photo not loaded');
    const ow=image.naturalWidth, oh=image.naturalHeight;
    const target=targetDimensions(ow,oh,longEdge,settings.framing ?? fit);
    const canvas=document.createElement('canvas');
    if(settings.filter==='ink-signal'){
        // Quantize at the requested export size, capped by the source and the
        // app's largest preset. The final JPEG does not upscale a 1400px effect.
        const inkSize=longEdge===0?Math.min(4000,Math.max(ow,oh)):longEdge;
        const framing=longEdge===0?'fit':settings.framing;
        renderFiltered(image,canvas,{...settings,framing},inkSize,4000,false,0);
        if(canvas.width!==target.w||canvas.height!==target.h){
            const full=document.createElement('canvas');
            full.width=target.w;full.height=target.h;
            full.getContext('2d').drawImage(canvas,0,0,target.w,target.h);
            return finishJpeg(full,settings,created);
        }
    }else{
        const work=document.createElement('canvas');
        renderFiltered(image,work,settings,longEdge,1400,false,0);
        canvas.width=target.w;canvas.height=target.h;
        const ctx=canvas.getContext('2d');
        ctx.imageSmoothingQuality='high';
        ctx.drawImage(work,0,0,target.w,target.h);
    }
    return finishJpeg(canvas,settings,created);
}
function finishJpeg(canvas,settings,created) {
    const target={w:canvas.width,h:canvas.height};
    const ctx=canvas.getContext('2d');
    if(settings.timestamp) {
        ctx.font=`${Math.max(12,Math.floor(target.w/36))}px monospace`;
        ctx.fillStyle='#ffc373';ctx.shadowColor='#000';ctx.shadowBlur=5;ctx.textAlign='right';
        ctx.fillText(new Date(created??Date.now()).toLocaleDateString('en-CA'),target.w-14,target.h-16);
    }
    return blobOfCanvas(canvas);
}
async function download(blob, name) {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = name;
    document.body.append(link);
    try {
        link.click();
        alertStatus('Download requested.');
        return true;
    } finally {
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 15000);
    }
}
async function exportPhoto(share = false) { try {
    const b = await outputBlob();
    const name = (current?.name || 'TapeBooth') + '.jpg';
    const file = new File([b], name, { type: 'image/jpeg' });
    if (share && navigator.canShare?.({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Tape Booth photo' });
        alertStatus('Shared via system sheet');
    }
    else {
        await download(b, name);
    }
}
catch (e) {
    if (e.name !== 'AbortError')
        alertStatus('Export failed: ' + e.message);
} }
async function saveEdit() { if (!current)
    return; try {
    current = { ...current, edit: { ...edit, quality, framing: fit } };
    await addPhoto(current);
    photos = await getPhotos();
    alertStatus('Edits saved. Original preserved.');
}
catch (e) {
    alertStatus('Could not save edits: ' + e.message);
} }
async function changePage(next) { if (page === 'camera' && next !== 'camera')
    stopCamera(); if (next === 'gallery') {
    try { photos = await getPhotos(); }
    catch (e) { alertStatus('Gallery unavailable: ' + e.message); return; }
} page = next; render(); }
function setTheme(next) { theme = next; localStorage.setItem('tb-theme', next); render(); }
async function backup() { try {
    const payload = [];
    for (const p of photos) {
        const b = new Uint8Array(await p.original.arrayBuffer());
        let binary = '';
        for (let i = 0; i < b.length; i += 8192)
            binary += String.fromCharCode(...b.subarray(i, i + 8192));
        payload.push({ id: p.id, created: p.created, edit: p.edit, kind: p.kind, name: p.name, mime: p.original.type, data: btoa(binary) });
    }
    await download(new Blob([JSON.stringify({ format: 'tape-booth-backup-v1', photos: payload })], { type: 'application/json' }), 'tape-booth-backup.json');
}
catch (e) {
    alertStatus('Backup failed: ' + e.message);
} }
async function restore(file) { try {
    const json = JSON.parse(await file.text());
    if (json.format !== 'tape-booth-backup-v1' || !Array.isArray(json.photos))
        throw Error('Not a Tape Booth backup');
    for (const item of json.photos) {
        if (typeof item.data !== 'string' || !item.edit || !item.id)
            continue;
        const binary = atob(item.data);
        const b = new Uint8Array(binary.length);
        for (let i = 0; i < b.length; i++)
            b[i] = binary.charCodeAt(i);
        await addPhoto({ id: item.id, created: item.created, edit: item.edit, kind: item.kind === 'video' ? 'video' : 'photo', name: item.name, original: new Blob([b], { type: item.mime || 'image/jpeg' }) });
    }
    photos = await getPhotos();
    render();
    alertStatus(`Restore complete · ${photos.length} photos`);
}
catch (e) {
    alertStatus('Restore failed: ' + e.message);
} }
function bind() {
    refreshArt();
    $('#artOpen')?.addEventListener('click',()=>$('#artDialog').showModal());
    document.querySelectorAll('[data-art]').forEach(input=>input.addEventListener('input',()=>{
        const key=input.dataset.art;
        edit.art={...artSettings(edit),[key]:+input.value};
        $('#art-'+key+'-value').value=input.value+'%';
        if(page==='camera')drawPreview();
        else drawEditor();
    }));
    document.querySelectorAll('[data-pick-preset]').forEach(b=>b.addEventListener('click',()=>{edit.filter=b.dataset.pickPreset;edit.effects={};edit.art=undefined;resolutionOverride=null;changePage('camera');}));
    $('#themeBtn')?.addEventListener('click', () => setTheme(theme === 'light' ? 'dark' : 'light'));
    document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => changePage(b.dataset.go)));
    $('#cameraFilter')?.addEventListener('change', event => {
        edit.filter = event.target.value;
        edit.effects = {};
        edit.art = undefined;
        resolutionOverride = null;
        $('#cameraResolution').innerHTML = resolutionOptions();
        $('#cameraLabel').textContent = FILTERS.find(filter => filter.id === edit.filter).tag;
        refreshArt();
        drawPreview();
    });
    document.querySelectorAll('[data-filter]').forEach(button => {
        button.addEventListener('click', () => {
            edit.filter = button.dataset.filter;
            edit.effects = {};
            edit.art = undefined;
            resolutionOverride = null;
            refreshArt();
            refreshEffectControls();
            for (const option of document.querySelectorAll('[data-filter]')) {
                const selected = option === button;
                option.classList.toggle('selected', selected);
                option.setAttribute('aria-pressed', selected);
            }
            drawEditor();
        });
    });
    for (const key of ['intensity', 'degradation', 'grain']) {
        const el = $('#' + key);
        el?.addEventListener('input', () => { edit[key] = +el.value; $('#' + key + 'Val').textContent = el.value + '%'; if (page === 'camera')
            drawPreview(); if (page === 'editor')
            drawEditor(); });
    }
    document.querySelectorAll('[data-effect]').forEach(el => el.addEventListener('input', () => { const key = el.dataset.effect; edit.effects = { ...edit.effects, [key]: +el.value }; $('#fx-' + key + 'Val').textContent = el.value + '%'; if (page === 'camera')
        drawPreview();
    else
        drawEditor(); }));
    $('#resetEffects')?.addEventListener('click', () => { edit.effects = {}; refreshEffectControls(); if (page === 'camera')
        drawPreview();
    else
        drawEditor(); });
    $('#fakeFlash')?.addEventListener('change', e => { edit.flash = e.target.checked; if (page === 'camera')
        drawPreview();
    else
        drawEditor(); });
    $('#stamp')?.addEventListener('change', e => { edit.timestamp = e.target.checked; if (page === 'editor')
        drawEditor(); });
    $('#startCam')?.addEventListener('click', startCamera);
    $('#cameraResolution')?.addEventListener('change', e => { resolutionOverride = e.target.value === 'native' ? null : +e.target.value; drawPreview(); });
    document.querySelectorAll('[data-mode]').forEach(button => button.addEventListener('click', () => {
        if (recording) return;
        videoMode = button.dataset.mode === 'video';
        for (const control of document.querySelectorAll('[data-mode]')) {
            const active = control.dataset.mode === button.dataset.mode;
            control.classList.toggle('on', active);
            control.setAttribute('aria-pressed', active);
        }
        updateRecordControls();
    }));
    $('#switchCamera')?.addEventListener('click', async () => { cameraFacing = cameraFacing === 'user' ? 'environment' : 'user'; stopCamera(); await startCamera(); });
    $('#selfieMirror')?.addEventListener('change', e => { selfieMirror = e.target.checked; drawPreview(); });
    $('#shutter')?.addEventListener('click', shutter);
    $('#import')?.addEventListener('change', async (e) => { const f = e.target.files?.[0]; if (f)
        await importFile(f); });
    document.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', () => { const index = photos.findIndex(p => p.id === el.dataset.open); if (index >= 0) { galleryIndex = index; galleryMode = 'playback'; render(); } }));
    $('[data-editor-back]')?.addEventListener('click', () => { galleryMode = editorReturn === 'playback' ? 'playback' : 'grid'; changePage('gallery'); });
    document.querySelectorAll('[data-gallery]').forEach(el => el.addEventListener('click', () => { galleryMode = el.dataset.gallery; render(); }));
    $('#prevPhoto')?.addEventListener('click', () => { galleryIndex = (galleryIndex + photos.length - 1) % photos.length; render(); });
    $('#nextPhoto')?.addEventListener('click', () => { galleryIndex = (galleryIndex + 1) % photos.length; render(); });
    $('#openPlaying')?.addEventListener('click', () => { if (photos[galleryIndex])
        openEditor(photos[galleryIndex]); });
    $('#downloadPlaying')?.addEventListener('click', async () => {
        const item = photos[galleryIndex];
        if (!item) return;
        if (item.kind === 'video') { download(item.original, item.name + '.webm'); return; }
        const url = URL.createObjectURL(item.original);
        try {
            const image = new Image();
            image.src = url;
            await image.decode();
            const size = item.edit?.quality ?? NATIVE_RES[item.edit?.filter] ?? 640;
            const blob = await outputBlob(image, {...DEFAULT_EDIT, ...item.edit}, size, item.created);
            download(blob, item.name + '.jpg');
        } catch (e) { alertStatus('Export failed: ' + e.message); }
        finally { URL.revokeObjectURL(url); }
    });
    $('#removeClip')?.addEventListener('click', async () => {
        const item = photos[galleryIndex];
        if (!item || !confirm('Delete this video from the internal gallery?')) return;
        try { await deletePhoto(item.id); photos = await getPhotos(); render(); }
        catch (e) { alertStatus('Could not delete video: ' + e.message); }
    });
    $('#saveEdit')?.addEventListener('click', saveEdit);
    $('#export')?.addEventListener('click', () => exportPhoto(false));
    $('#share')?.addEventListener('click', () => exportPhoto(true));
    $('#remove')?.addEventListener('click', async () => { if (!current || !confirm('Delete this photo from the internal gallery?'))
        return; await deletePhoto(current.id); current = null; photos = await getPhotos(); await changePage('gallery'); alertStatus('Photo deleted'); });
    $('#quality')?.addEventListener('change', e => { quality = +e.target.value; if(page === 'editor') drawEditor(); });
    $('#fit')?.addEventListener('change', e => { fit = e.target.value; if(page === 'editor') drawEditor(); if(page === 'camera') drawPreview(); });
    $('#jpeg')?.addEventListener('input', e => { jpeg = +e.target.value / 100; $('#jpegValue').textContent = Math.round(jpeg * 100) + '%'; });
    $('#mute')?.addEventListener('change', e => { mute = e.target.checked; });
    $('#themeSelect')?.addEventListener('change', e => setTheme(e.target.value));
    $('#backup')?.addEventListener('click', backup);
    $('#restore')?.addEventListener('change', e => { const f = e.target.files?.[0]; if (f)
        restore(f); });
}
async function boot() { try {
    photos = await getPhotos();
}
catch (e) {
    console.error(e);
